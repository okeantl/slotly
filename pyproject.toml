[project]
name = "slotly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.161.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version="py312"
line-length=100


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


[tool.mypy]
strict = true
python_version="3.12"
plugins = ["pydantic.mypy"]
